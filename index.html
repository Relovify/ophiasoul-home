<!doctype html>
<html lang="es">
<head>
<title>Ophiasoul</title>
<!-- brand: ophiasoul . scope: ophiasoul . tier: public . lane: light -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --ground:#FBF9F5; --band:#F3EFE9; --gold:#B79A56; --ink:#15172F; }
  *, *::before, *::after { box-sizing:border-box; }
  main { min-width:0; }
  html, body { margin:0; height:100%; background:var(--band); color:var(--ink); }
  body { display:flex; padding:16px; box-sizing:border-box; font-family:"Albert Sans", system-ui, sans-serif; font-weight:300; }
  main {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
    background:var(--ground); border:3px solid var(--gold); border-radius:12px; padding:48px 16px;
  }
  img { width:min(360px, 70vw); height:auto; filter:drop-shadow(0 6px 14px rgba(117,96,47,.18)); }
  h1 { margin:0; font-weight:300; font-size:1.25rem; letter-spacing:.32em; text-transform:uppercase; padding-left:.32em; }
  p { margin:-12px 0 0; font-size:.95rem; letter-spacing:.08em; color:#555B87; text-align:center; text-wrap:balance; }
</style>
</head>
<body>
<main>
  <img src="glyph.png" width="720" height="720" alt="Ophiasoul">
  <h1>Ophiasoul</h1>
  <p>Tu tiempo vuelve a ser tuyo.</p>
</main>
</body>
</html>
